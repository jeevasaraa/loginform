<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firebase Student Form</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f2f2;
      padding:20px;
    }

    .container{
      max-width:500px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
    }

    input, select{
      width:100%;
      padding:10px;
      margin-top:5px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:10px;
      background:blue;
      color:white;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:darkblue;
    }

    #status{
      text-align:center;
      margin-top:15px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Student Registration Form</h1>

  <form id="userForm">

    <label>Name:</label>
    <input type="text" id="name" required>

    <label>Password:</label>
    <input type="password" id="password" required>

    <label>Register Number:</label>
    <input type="text" id="register" required>

    <label>Phone Number:</label>
    <input type="tel" id="phonenumber" required>

    <label>Address:</label>
    <input type="text" id="address" required>

    <!-- DATE SELECT OPTION -->
    <label>Date of Birth:</label>
    <input type="date" id="dob" required>

    <!-- DOMAIN SELECT OPTION -->
    <label>Domain:</label>
    <select id="domain" required>
      <option value="">Select Domain</option>
      <option>Full Stack Development</option>
      <option>Frontend Development</option>
      <option>Backend Development</option>
      <option>UI/UX Design</option>
      <option>Python Development</option>
      <option>Data Science</option>
    </select>

    <!-- MARKS -->
    <label>12th Mark:</label>
    <input type="number" id="marks" required>

    <!-- COLLEGE NAME -->
    <label>College Name:</label>
    <input type="text" id="college" required>

    <!-- GENDER SELECT -->
    <label>Gender:</label>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <label>Email:</label>
<input type="email" id="email" required>

<label>Father Name:</label>
<input type="text" id="fathername" required>

<label>Mother Name:</label>
<input type="text" id="mothername" required>

<label>Blood Group:</label>
<select id="bloodgroup" required>
  <option value="">Select Blood Group</option>
  <option>A+</option>
  <option>A-</option>
  <option>B+</option>
  <option>B-</option>
  <option>AB+</option>
  <option>AB-</option>
  <option>O+</option>
  <option>O-</option>
</select>

<label>Nationality:</label>
<input type="text" id="nationality" required>

<label>10th Mark:</label>
<input type="number" id="tenthmark" required>

<label>CGPA:</label>
<input type="number" step="0.01" id="cgpa" required>

<label>Department:</label>
<input type="text" id="department" placeholder="BCA" required>

<label>University:</label>
<input type="text" id="university" required>

<label>Skills:</label>
<input type="text" id="skills"
placeholder="HTML, CSS, Java, Python, Firebase">

<label>Programming Language:</label>
<select id="language">
  <option>Java</option>
  <option>Python</option>
  <option>C</option>
  <option>C++</option>
  <option>JavaScript</option>
</select>

<label>Project Title:</label>
<input type="text" id="project">

<label>Project Description:</label>
<input type="text" id="projectdesc">

<label>GitHub Link:</label>
<input type="url" id="github">

<label>Interested Role:</label>
<select id="role">
  <option>Frontend Developer</option>
  <option>Backend Developer</option>
  <option>Full Stack Developer</option>
  <option>UI/UX Designer</option>
  <option>Python Developer</option>
</select>

<label>Expected Salary:</label>
<input type="number" id="salary">

    <!-- YEAR SELECT -->
    <label>Year:</label>
    <select id="year" required>
      <option value="">Select Year</option>
      <option>1st Year</option>
      <option>2nd Year</option>
      <option>3rd Year</option>
    </select>

    <button type="submit">Submit</button>

  </form>

  <p id="status"></p>
</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import { getDatabase, ref, push, set }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  // Firebase Config
  const firebaseConfig = {
    apiKey:"AIzaSyAQNMrl_rmLfSdPMgrqBYwOHjzHbnOzlng",
  authDomain: "example-5b9e7.firebaseapp.com",
  databaseURL:"https://example-5b9e7-default-rtdb.firebaseio.com/",
  projectId: "example-5b9e7",
  storageBucket:"example-5b9e7.firebasestorage.app",
  messagingSenderId: "570564386913",
  appId:"1:570564386913:web:f84506f98ef7f97be28a20",
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const form = document.getElementById("userForm");
  const status = document.getElementById("status");

  form.addEventListener("submit", (e) => {

    e.preventDefault();

    const userData = {

      name: document.getElementById("name").value,
      password: document.getElementById("password").value,
      register: document.getElementById("register").value,
      phonenumber: document.getElementById("phonenumber").value,
      address: document.getElementById("address").value,

      dob: document.getElementById("dob").value,
      domain: document.getElementById("domain").value,
      marks: document.getElementById("marks").value,
      college: document.getElementById("college").value,
      gender: document.getElementById("gender").value,
      email: document.getElementById("email").value,
      fathername: document.getElementById("fathername").value,
      mothername: document.getElementById("mothername").value,
      bloodgroup: document.getElementById("bloodgroup").value,
      nationality: document.getElementById("nationality").value,
      tenthmark: document.getElementById("tenthmark").value,
      cgpa: document.getElementById("cgpa").value,
      department: document.getElementById("department").value,
      university: document.getElementById("university").value,
      skills: document.getElementById("skills").value,
      language: document.getElementById("language").value,
      project: document.getElementById("project").value,
      projectdesc: document.getElementById("projectdesc").value,
      github: document.getElementById("github").value,
      role: document.getElementById("role").value,
      salary: document.getElementById("salary").value,
      year: document.getElementById("year").value
    };

    const userRef = push(ref(database, "students"));

    set(userRef, userData)

    .then(() => {
      status.innerText = "Data Saved Successfully!";
      form.reset();
    })

    .catch((error) => {
      status.innerText = "Error: " + error.message;
    });

  });

</script>

</body>
</html>
